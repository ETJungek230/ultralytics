# PP-TinyPose 128x96 top-down heatmap network (17 COCO joints).
# Input is a person crop; run a detector such as PicoDet before this model.
nc: 1
kpt_shape: [ 17, 3 ]
backbone:
  # ========================================
  # Stem
  # ========================================
  - [ -1, 1, Conv, [ 32, 3, 2 ] ]                     # 0: Stem conv, stride 2
  - [ 0, 1, SplitChannels, [ 2 ] ]                    # 1: Split into two 16-channel branches
  - [ 1, 1, Index, [ 16, 0 ] ]                        # 2: Left branch
  - [ 1, 1, Index, [ 16, 1 ] ]                        # 3: Right branch

  # Left branch
  - [ 2, 1, DWConv, [ 16, 3, 2 ] ]                    # 4
  - [ -1, 1, Conv, [ 16, 1, 1 ] ]                     # 5

  # Right branch
  - [ 3, 1, Conv, [ 32, 1, 1 ] ]                      # 6
  - [ -1, 1, DWConv, [ 32, 3, 2 ] ]                   # 7
  - [ -1, 1, Conv, [ 16, 1, 1 ] ]                     # 8

  - [ [ 5, 8 ], 1, Concat, [ 1 ] ]                    # 9: Stem output, 32 channels

  # ========================================
  # Transition 0
  # Branches: 40 / 80
  # ========================================
  - [ 9, 1, DWConv, [ 32, 3, 1 ] ]                    # 10
  - [ -1, 1, Conv, [ 40, 1, 1 ] ]                     # 11: Branch 0, stride 4

  - [ 9, 1, DWConv, [ 32, 3, 2 ] ]                    # 12
  - [ -1, 1, Conv, [ 80, 1, 1 ] ]                     # 13: Branch 1, stride 8

  # ========================================
  # Stage 0: 2 x LiteHRModule
  # ========================================
  - [ [ 11, 13 ], 1, LiteHRModule, [ [ 40, 80 ] ] ]   # 14
  - [ -1, 1, LiteHRModule, [ [ 40, 80 ] ] ]           # 15

  - [ 15, 1, Index, [ 40, 0 ] ]                       # 16
  - [ 15, 1, Index, [ 80, 1 ] ]                       # 17

  # ========================================
  # Transition 1: add branch 160
  # ========================================
  - [ 17, 1, DWConv, [ 80, 3, 2 ] ]                   # 18
  - [ -1, 1, Conv, [ 160, 1, 1 ] ]                    # 19

  # ========================================
  # Stage 1: 4 x LiteHRModule
  # ========================================
  - [ [ 16, 17, 19 ], 1, LiteHRModule, [ [ 40, 80, 160 ] ] ]  # 20
  - [ -1, 1, LiteHRModule, [ [ 40, 80, 160 ] ] ]              # 21
  - [ -1, 1, LiteHRModule, [ [ 40, 80, 160 ] ] ]              # 22
  - [ -1, 1, LiteHRModule, [ [ 40, 80, 160 ] ] ]              # 23

  - [ 23, 1, Index, [ 40, 0 ] ]                       # 24
  - [ 23, 1, Index, [ 80, 1 ] ]                       # 25
  - [ 23, 1, Index, [ 160, 2 ] ]                      # 26

  # ========================================
  # Transition 2: add branch 320
  # ========================================
  - [ 26, 1, DWConv, [ 160, 3, 2 ] ]                  # 27
  - [ -1, 1, Conv, [ 320, 1, 1 ] ]                    # 28

  # ========================================
  # Stage 2: 2 x LiteHRModule
  # ========================================
  - [ [ 24, 25, 26, 28 ], 1, LiteHRModule, [ [ 40, 80, 160, 320 ] ] ] # 29
  - [ -1, 1, LiteHRModule, [ [ 40, 80, 160, 320 ] ] ]                 # 30

  - [ 30, 1, Index, [ 40, 0 ] ]                       # 31
  - [ 30, 1, Index, [ 80, 1 ] ]                       # 32
  - [ 30, 1, Index, [ 160, 2 ] ]                      # 33
  - [ 30, 1, Index, [ 320, 3 ] ]                      # 34

  # ========================================
  # Iterative Head
  # ========================================

  # Branch 3: 320 -> 160
  - [ 34, 1, DWConv, [ 320, 3, 1 ] ]                  # 35
  - [ -1, 1, Conv, [ 160, 1, 1 ] ]                    # 36

  # Branch 2: 160 -> 80
  - [ 36, 1, nn.Upsample, [ None, 2, bilinear, True ] ] # 37
  - [ [ 33, 37 ], 1, TensorAdd, [ ] ]                   # 38
  - [ -1, 1, DWConv, [ 160, 3, 1 ] ]                    # 39
  - [ -1, 1, Conv, [ 80, 1, 1 ] ]                       # 40

  # Branch 1: 80 -> 40
  - [ 40, 1, nn.Upsample, [ None, 2, bilinear, True ] ] # 41
  - [ [ 32, 41 ], 1, TensorAdd, [ ] ]                   # 42
  - [ -1, 1, DWConv, [ 80, 3, 1 ] ]                     # 43
  - [ -1, 1, Conv, [ 40, 1, 1 ] ]                       # 44

  # Branch 0: 40 -> 40
  - [ 44, 1, nn.Upsample, [ None, 2, bilinear, True ] ] # 45
  - [ [ 31, 45 ], 1, TensorAdd, [ ] ]                   # 46
  - [ -1, 1, DWConv, [ 40, 3, 1 ] ]                     # 47
  - [ -1, 1, Conv, [ 40, 1, 1 ] ]                       # 48
head:
  - [ -1, 1, TinyPoseHeatmap, [ 17, 4 ] ]
